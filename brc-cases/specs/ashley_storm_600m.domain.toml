# Ashley Valley rotating cell, 11-12 Oct 2025 -- domain spec (TWO DOMAINS).
#
# GEOMETRY IS LIFTED VERBATIM from ashley_drainage_600m.domain.toml. Every number in
# [grid], [coarse] and [target].bbox is identical, deliberately: that configuration
# integrated 9 h over this terrain with ZERO cfl messages at a measured 0.597 wall-h
# per simulated hour (job 14338744), and re-deriving geometry for a case that does
# not need it would throw away the only stability evidence we have. If domain_calc
# reports e_we/e_sn/i_parent_start different from 130x115 and 355x285, this file has
# been mis-copied -- that equality is the check, and it is asserted at gate B.
#
# WHAT CHANGES IS [share] AND [run] ONLY. Physics, the vertical grid and the output
# streams are not in this file at all; they live in namelist.input under
# $WRF_ARCHIVE/ashley_storm_600m/control/draft/, per the split domain_calc enforces
# (namelist.wps is generated wholesale, namelist.input carries hand-authored physics).
#
#   python brc-cases/domain_calc.py brc-cases/specs/ashley_storm_600m.domain.toml
#
# Tracked in ../ub-wx/experiments/20251011-ashley-rotating-cell/.

[case]
name = "ashley_storm_600m"
header = """ashley_storm_600m -- DRAFT namelist.wps (Gate B input, NOT accepted geometry)
GENERATED by brc-cases/domain_calc.py from specs/ashley_storm_600m.domain.toml.
Do not hand-edit: edit the spec and re-render, or the namelist and the experiment
record will disagree about what ran.

Two-domain 5:1 ladder, 3 km -> 600 m, one-way (feedback=0), spanning the whole Uinta
Basin. Geometry identical to ashley_drainage_600m; only the time window differs."""

[grid]
# UNCHANGED from the drainage spec. dt 9 s / 3 s is fixed (no adaptive dt) and sits
# at 83% of the 6dx guideline on both domains.
dx                     = [3000.0, 600.0]
parent_grid_ratio      = [1, 5]
parent_time_step_ratio = [1, 3]
time_step              = 9.0

ref_lat   = 40.26
ref_lon   = -109.725
# 39/42 BRACKET the domain. The inherited 30/60 left a map factor of 0.9695 at 40.5 N,
# so a nominal 120 m grid was really 123.8 m on the ground -- a 3.1% error in every
# derived quantity. Do not "simplify" these back to the WPS defaults.
truelat1  = 39.0
truelat2  = 42.0
stand_lon = -109.725

nest_margin_cells = 30

geog_data_res  = ["default", "brc_custom_3s+default"]
geog_data_path = "/scratch/general/vast/u0737349/wps_geog_terrain3s/"

[coarse]
e_we = 130
e_sn = 115

[d02]
# INERT with two domains (domain_calc sizes the finest domain from [target]); kept so
# the file diffs cleanly against the drainage spec.
e_we   = 351
e_sn   = 286
center = [-109.725, 40.26]

[target]
# The whole Basin. Sized for the drainage case's basin-wide cold-air reservoir, and
# it happens to be right here too: a cell moving ENE at ~12 m/s covers ~215 km in 5 h,
# so both the upstream initiation region and the track past Split Mountain to the
# Colorado line stay inside the domain for the full window.
bbox = [-110.96, 39.49, -108.49, 41.03]
waypoint_min_inset_km = 2.0

[target.waypoints]
# The drainage waypoints stay (they are the same valley) and three are added for this
# case. spotter_point is the coordinate of the 02:20Z wind report and the 02:30-02:40Z
# funnel; kvel is the nearest official trace and the only low-level verification that
# exists, since KGJX's beam is ~3.5 km AGL over Vernal at its lowest tilt.
dry_fork_canyon = [-109.63, 40.58]
maeser          = [-109.58, 40.48]
vernal          = [-109.53, 40.455]
jensen          = [-109.35, 40.37]
spotter_point   = [-109.51104, 40.41076]
kvel            = [-109.51273, 40.44295]
split_mountain  = [-109.35326, 40.39136]

[share]
# EVENT: 11-12 OCTOBER 2025. Chosen because something was observed, not by screening.
# start_date is the wrf.exe init. 23Z is 1h42m BEFORE sunset at Vernal (~00:41 UTC),
# so the model builds its own evening transition, decaying CBL and drainage onset
# before the storm arrives instead of inheriting an already-stabilised state from a
# later cycle -- worth more here than a shorter lead to the 02:20Z report.
#
# end_date is deliberately LATER than the run end (see [run]): real.exe then builds a
# wrfbdy_d01 spanning 7 h to 06Z, so a restart extension is legal without re-running
# WPS. Staging covers HRRR f00..f07 for the same reason.
start_date       = "2025-10-11_23:00:00"
end_date         = "2025-10-12_06:00:00"
interval_seconds = 3600
# MUST match nocolons in namelist.input &time_control. Without it WPS writes
# met_em...23:00:00.nc while real.exe asks for ...23_00_00.nc and dies with a message
# that names neither file. Cost a gate D submission before it was tracked.
nocolons         = true

[run]
# wrf.exe integrates 23Z 11 Oct -> 04Z 12 Oct. The 5th hour past JRL's original 03Z
# is not padding: the funnel "was less prominent as the cell got closer to Split
# Mountain" by ~02:45Z, so the decay IS a terrain-interaction result and cutting the
# window at 03Z would remove the thing worth explaining. Costs ~0.6 wall-h.
hours = 5
