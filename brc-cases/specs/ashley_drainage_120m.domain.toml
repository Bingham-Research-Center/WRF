# Ashley Valley 120 m drainage -- domain spec.
#
# This is the human-editable description of WHAT should be covered. The geometry
# (e_we/e_sn/i_parent_start/...) is DERIVED from it by domain_calc.py, so a domain
# change is an edit here plus a re-render, never a hand-edited namelist.
#
#   python brc-cases/domain_calc.py brc-cases/specs/ashley_drainage_120m.domain.toml
#
# Tracked in ../ub-wx/experiments/ashley-drainage-120m/ (rationale in its
# proposal.md). Event and window live in [share] below.

[case]
name = "ashley_drainage_120m"
header = """ashley_drainage_120m -- DRAFT namelist.wps (Gate B input, NOT accepted geometry)
GENERATED by brc-cases/domain_calc.py from specs/ashley_drainage_120m.domain.toml.
Do not hand-edit: edit the spec and re-render, or the namelist and the experiment
record will disagree about what ran.

Three-domain 5:1 ladder, 3 km -> 600 m -> 120 m, one-way (feedback=0).
d02 spans the Uinta Basin; d03 covers the Ashley Valley drainage system.
i/j_parent_start are DERIVED and must still be confirmed against a geogrid-only
preview PNG before this geometry is accepted."""

[grid]
# LADDER CHANGED 2026-07-28: d03 120 m -> 200 m, ratios 5:5 -> 5:3.
#
# WHY. The 120 m configuration never integrated. Two distinct failures were seen:
# vertical-CFL blow-ups (W reaching 1737 m/s, then NaN) always landing on d03's
# steepest cells, and a separate stall in which the model burns 97% CPU without
# advancing. Eleven dials were falsified against them -- epssm, zadvect_implicit,
# diff_opt, dzbot, fixed dt, adaptive dt, radiation, microphysics, PBL scheme,
# tracer advection and MPI decomposition -- so this is a geometry change, not
# another tuning attempt.
#
# WHAT 200 m BUYS. Over the same footprint the count of cells steeper than 45 deg
# falls 87 -> 4, and every blow-up observed landed on one of those cells. Cost falls
# to 0.22x, which also makes iterating affordable.
#
# WHAT IT COSTS, measured rather than assumed. The Dry Fork canyon is 0.4-4.6 km
# wide. At the FLUX GATE (40.565 N) it is 4.6 km, so 200 m still gives ~23 cells
# across it -- the flux measurement is unaffected. The narrow upper canyon (0.4 km)
# drops from 3 cells to 1.8, but 3 cells was already below the ~8 needed to resolve
# a drainage jet, so almost nothing that 120 m actually delivered is lost.
#
# TIME STEP: fixed, by JRL's preference -- adaptive dt was tried and, while it
# integrated ten times further than any fixed step, it makes dt a dependent variable
# and would have broken CHK-LADDER's hold-everything-constant requirement.
# 9 s with ratios 1,3,3 gives d03 dt = 1.0 s, inside the 1.33 s 6dx guideline at
# 200 m. Note adaptive dt CHOSE 0.91 s at 120 m -- larger than the 0.625 s that blew
# up -- which is why dt was never the binding constraint.
dx                     = [3000.0, 600.0, 200.0]
parent_grid_ratio      = [1, 5, 3]
parent_time_step_ratio = [1, 3, 3]
time_step              = 9.0

# Centred on the Uinta Basin, matching the sibling case's projection convention.
# Re-centred with d02's third enlargement so d01 and d02 stay concentric.
ref_lat   = 40.26
ref_lon   = -109.725
# Standard parallels BRACKET the domain (which spans ~38.8-41.9 N). The sibling's
# inherited 30/60 left a map factor of 0.9695 at 40.5 N, so its nominal 120 m grid
# was really 123.8 m on the ground -- a 3.1% error inherited by every derived
# quantity and by the phrase "120 m" in any write-up. 39/42 puts the map factor at
# ~1.00 and makes the nominal spacing the true spacing.
truelat1  = 39.0
truelat2  = 42.0
stand_lon = -109.725

# Parent cells of clearance to aim for when auto-sizing an intermediate domain.
nest_margin_cells = 30

# d03 uses the 3-arc-second custom terrain (~90 m source for a 120 m grid: matched,
# where the 1-arc-second set built for the 37 m sibling is over-resolved here).
geog_data_res  = ["default", "brc_custom_3s+default", "brc_custom_3s+default"]
geog_data_path = "/scratch/general/vast/u0737349/wps_geog_terrain3s/"

[coarse]
# d01: synoptic relay. Generous so d02 sits well clear of the relaxation-contaminated
# rim; d01 is a negligible fraction of cost, so buying margin here is nearly free.
e_we = 130
e_sn = 115

[d02]
# Explicit rather than auto-sized: d02 must span the whole BASIN, which is a science
# requirement (the only domain on which a basin-wide cold-air reservoir is
# representable), not merely a wrapper around d03. Its own centre is given for the
# same reason -- centring it on d03 would slide the box east off Duchesne.
# Enlarged three times, each for a stated reason:
#   186 -> 251 (N-S): the north edge ran close to the Uinta crest, the SOURCE
#     region for Dry Fork drainage, leaving that air near the relaxation zone.
#   271 -> 351 (E-W): +5% west to take west-Basin flow in full, and +10% east to
#     ~-108.5 to catch drainage entering the Basin from the Colorado side.
#   251 -> 286 (N-S): further south to ~39.5 for more of the Green River canyon.
# Now ~-110.96 to -108.49, ~39.49 to 41.03 (208 x 171 km).
e_we   = 351
e_sn   = 286
center = [-109.725, 40.26]

[target]
# d03: the Ashley Valley drainage system. Dry Fork canyon exit through Vernal and
# Maeser to Jensen, east to Split Mountain. Browns Park is deliberately EXCLUDED --
# it lies north of the Diamond Mountain / Blue Mountain divide, does not feed the
# Dry Fork gate, and would cost ~2.4x on the dominant domain.
bbox = [-109.72, 40.30, -109.14, 40.66]
waypoint_min_inset_km = 2.0

[target.waypoints]
dry_fork_canyon = [-109.63, 40.58]
maeser          = [-109.58, 40.48]
vernal          = [-109.53, 40.455]
jensen          = [-109.35, 40.37]
split_mountain  = [-109.20, 40.44]

[share]
# EVENT (revised 2026-07-28): 8-9 SEPTEMBER 2025, replacing 24-25 April 2026.
# Chosen by JRL from PC101 (Synoptic), the Dry Fork canyon truth site at 40.5235
# -109.6063, 1785 m -- which sits INSIDE d03, ~6 km down-canyon of the Dry Fork
# waypoint, so the run has an in-domain validation point the April case never had.
# PC101 shows a clean bidirectional slope-flow reversal: down-canyon (NW, 290-350)
# overnight, switching to up-canyon (SE, 110-200) at ~15Z with the temperature rise
# rate dropping as anabatic flow begins, then back to down-canyon at 21:50Z on 8 Sep
# with a 6.0 m/s surge -- the highest wind of any September night at the site.
# WHY THIS EVENT OVER 24-25 APRIL: April failed proposal 4a's weak-synoptic-flow
# criterion outright (HRRR showed 8-14 m/s Basin-wide before sunset). September is
# 1-4 m/s outside the surge.
# KNOWN CAVEAT, accepted: the 21:50Z surge is LOCAL and TRANSIENT, not a propagating
# hydraulic front -- no neighbouring station (QV4, A3822, QRS) sees it, and PC101
# holds down-canyon only 68% of the following 3 h. The coherent basin-wide
# transition is ~02:00Z on 9 Sep, near sunset.
#
# WINDOW: 20Z 8 Sep -> 05Z 9 Sep (9 h) is what wrf.exe integrates -- see [run].
# end_date below is deliberately LATER, 12Z 9 Sep, so real.exe builds a wrfbdy_d01
# spanning 16 h. That makes a later RESTART EXTENSION legal without re-running WPS:
# boundary conditions already exist out to 12Z, and restart_interval=60 writes a
# restart at 05Z. Staging covers HRRR f00..f16 for the same reason.
start_date       = "2025-09-08_20:00:00"
end_date         = "2025-09-09_12:00:00"
interval_seconds = 3600
# MUST match nocolons in namelist.input &time_control, which is .true. because colons
# in filenames break shell globs and rsync downstream. Nothing reconciles the two
# flags: without this, WPS writes met_em...20:00:00.nc while real.exe asks for
# ...20_00_00.nc and dies "bad date in namelist or file not in directory". Cost a
# gate D submission (job 14311434) before it was tracked as CHK-NOCOLONS.
nocolons         = true

[run]
hours = 9   # wrf.exe integrates 20Z->05Z; wrfbdy runs to 12Z for restarts
