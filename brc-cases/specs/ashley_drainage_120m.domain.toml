# Ashley Valley 120 m drainage -- domain spec.
#
# This is the human-editable description of WHAT should be covered. The geometry
# (e_we/e_sn/i_parent_start/...) is DERIVED from it by domain_calc.py, so a domain
# change is an edit here plus a re-render, never a hand-edited namelist.
#
#   python brc-cases/domain_calc.py brc-cases/specs/ashley_drainage_120m.domain.toml
#
# Tracked in ../ub-wx/experiments/ashley-drainage-120m/ (rationale in its
# proposal.md). NO EVENT IS CHOSEN -- start_date/end_date below are placeholders
# that geogrid ignores for geometry purposes but that must be replaced before any
# ungrib/metgrid work.

[case]
name = "ashley_drainage_120m"
header = """ashley_drainage_120m -- DRAFT namelist.wps (Gate B input, NOT accepted geometry)
GENERATED by brc-cases/domain_calc.py from specs/ashley_drainage_120m.domain.toml.
Do not hand-edit: edit the spec and re-render, or the namelist and the experiment
record will disagree about what ran.

Three-domain 5:1 ladder, 3 km -> 600 m -> 120 m, one-way (feedback=0).
d02 spans the Uinta Basin; d03 covers the Ashley Valley drainage system.
i/j_parent_start are DERIVED and must still be confirmed against a geogrid-only
preview PNG before this geometry is accepted."""

[grid]
dx                     = [3000.0, 600.0, 120.0]
parent_grid_ratio      = [1, 5, 5]
# Deliberately decoupled from parent_grid_ratio: matching 5,5 would give d03
# dt/25, roughly 3x more conservative than CFL requires. See proposal.md section 4.
parent_time_step_ratio = [1, 4, 4]
time_step              = 10.0

# Centred on the Uinta Basin, matching the sibling case's projection convention.
ref_lat   = 40.35
ref_lon   = -109.95
# Standard parallels BRACKET the domain (which spans ~38.8-41.9 N). The sibling's
# inherited 30/60 left a map factor of 0.9695 at 40.5 N, so its nominal 120 m grid
# was really 123.8 m on the ground -- a 3.1% error inherited by every derived
# quantity and by the phrase "120 m" in any write-up. 39/42 puts the map factor at
# ~1.00 and makes the nominal spacing the true spacing.
truelat1  = 39.0
truelat2  = 42.0
stand_lon = -109.95

# Parent cells of clearance to aim for when auto-sizing an intermediate domain.
nest_margin_cells = 30

# d03 uses the 3-arc-second custom terrain (~90 m source for a 120 m grid: matched,
# where the 1-arc-second set built for the 37 m sibling is over-resolved here).
geog_data_res  = ["default", "brc_custom_3s+default", "brc_custom_3s+default"]
geog_data_path = "/scratch/general/vast/u0737349/wps_geog_terrain3s/"

[coarse]
# d01: synoptic relay. Generous so d02 sits well clear of the relaxation-contaminated
# rim; d01 is a negligible fraction of cost, so buying margin here is nearly free.
e_we = 130
e_sn = 115

[d02]
# Explicit rather than auto-sized: d02 must span the whole BASIN, which is a science
# requirement (the only domain on which a basin-wide cold-air reservoir is
# representable), not merely a wrapper around d03. Its own centre is given for the
# same reason -- centring it on d03 would slide the box east off Duchesne.
e_we   = 271
e_sn   = 186
center = [-109.95, 40.35]

[target]
# d03: the Ashley Valley drainage system. Dry Fork canyon exit through Vernal and
# Maeser to Jensen, east to Split Mountain. Browns Park is deliberately EXCLUDED --
# it lies north of the Diamond Mountain / Blue Mountain divide, does not feed the
# Dry Fork gate, and would cost ~2.4x on the dominant domain.
bbox = [-109.72, 40.30, -109.14, 40.66]
waypoint_min_inset_km = 2.0

[target.waypoints]
dry_fork_canyon = [-109.63, 40.58]
maeser          = [-109.58, 40.48]
vernal          = [-109.53, 40.455]
jensen          = [-109.35, 40.37]
split_mountain  = [-109.20, 40.44]

[share]
# GEOGRID PLACEHOLDER. geogrid.exe must parse these but ignores them for geometry --
# geo_em depends only on the projection and grid. The WINDOW SHAPE is chosen
# (21Z -> 04Z, 7 h: 3 h spin-up + ~4 h past sunset, sized to ~12 wall-hours); the
# DATE is inherited from the sibling case and is NOT a selected event. Gate A0 sets
# the real one, and ungrib/metgrid must not run until it does. [event] in the ub-wx
# registry entry is still empty and the case manifest still says event_pending.
start_date       = "2025-01-28_21:00:00"
end_date         = "2025-01-29_04:00:00"
interval_seconds = 3600

[run]
hours = 7
